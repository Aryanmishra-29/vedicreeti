name: vedicreeti
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_dotenv: ^5.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  just_audio: ^0.10.5
  table_calendar: ^3.2.0
  intl: ^0.20.2
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  flutter_timezone: any
  supabase_flutter: ^2.5.0
  geolocator: ^13.0.1
  easy_localization: ^3.0.3
  google_fonts: ^8.2.1
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.3.1
  shimmer: ^3.0.0
  shared_preferences: ^2.5.5
  carousel_slider: ^5.1.2
  razorpay_flutter: ^1.4.5
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  url_launcher: ^6.3.2
  file_picker: ^8.0.0
  permission_handler: ^11.3.1
  alarm: ^5.10.0
  flutter_localizations:
    sdk: flutter

  rxdart: any
  uuid: any
  flutter_jailbreak_detection: any
  marquee: ^2.3.0
  flutter_staggered_grid_view: ^0.7.0
  connectivity_plus: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  image: ^4.8.0

flutter:
  uses-material-design: true

  # Assets ka path bilkul sahi hai, ise aise hi rehne do
  assets:
    - .env
    - assets/images/
    - assets/audio/
    - assets/translations/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#3F0E0E"
  adaptive_icon_foreground: "assets/images/app_icon_padded.png"